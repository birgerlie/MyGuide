name: MyGuide
options:
  bundleIdPrefix: io.github.birgerlie
  deploymentTarget: { iOS: "26.0" }
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  MyGuideCore: { path: Packages/MyGuideCore }
targets:
  MyGuide:
    type: application
    platform: iOS
    sources: [MyGuide, Shared]
    dependencies:
      - package: MyGuideCore
      - target: MyGuideWidgets
        embed: true
      - target: MyGuideWatch
        embed: true
    info:
      path: MyGuide/Info.plist
      properties:
        CFBundleDisplayName: MyGuide
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        # A test build may carry the owner's key from the git-ignored Config/Local.xcconfig (empty otherwise).
        MGBundledOpenAIKey: "$(OPENAI_BUNDLED_KEY)"
        UILaunchScreen: {}
        UIBackgroundModes: [audio, location]
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: io.github.birgerlie.MyGuide
            CFBundleURLSchemes: [myguide]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: "MyGuide uses the camera to photograph what you want a story about."
        NSLocationWhenInUseUsageDescription: "MyGuide uses your exact position and compass heading to work out what you are looking at."
        NSLocationAlwaysAndWhenInUseUsageDescription: "In walking mode MyGuide follows your position with the phone locked, so it can tell you about places you pass."
        NSPhotoLibraryUsageDescription: "MyGuide reads when and where a picked photo was taken, to tell its story and to place it in your diary."
        NSPhotoLibraryAddUsageDescription: "MyGuide saves the day story pages you choose to save to your photo library."
        NSMotionUsageDescription: "MyGuide notices when you stop and start walking, so walking mode can pause itself and save battery."
        NSHealthShareUsageDescription: "MyGuide starts the guided walk on your Apple Watch, where it is recorded as a walking workout. The iPhone app reads no health data."
        NSHealthUpdateUsageDescription: "MyGuide starts the guided walk on your Apple Watch, which saves it to Health as a walking workout. The iPhone app writes no health data."
    entitlements:
      path: MyGuide/MyGuide.entitlements
      properties:
        com.apple.developer.usernotifications.time-sensitive: true
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.birgerlie.MyGuide
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
  MyGuideWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources: [MyGuideWidgets, Shared]
    info:
      path: MyGuideWidgets/Info.plist
      properties:
        CFBundleDisplayName: MyGuide
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.birgerlie.MyGuide.Widgets
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  MyGuideWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources: [MyGuideWatch]
    dependencies:
      - package: MyGuideCore
    info:
      path: MyGuideWatch/Info.plist
      properties:
        CFBundleDisplayName: MyGuide
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: io.github.birgerlie.MyGuide
        WKBackgroundModes: [workout-processing]
        NSHealthShareUsageDescription: "MyGuide keeps a guided walk running on the watch, recorded as a walking workout, so it can buzz you about places while your wrist is down."
        NSHealthUpdateUsageDescription: "MyGuide keeps a guided walk running on the watch, recorded as a walking workout, so it can buzz you about places while your wrist is down."
    entitlements:
      path: MyGuideWatch/MyGuideWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.birgerlie.MyGuide.watchkitapp
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "4"
