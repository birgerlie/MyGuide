name: MyGuide
options:
  bundleIdPrefix: io.github.birgerlie
  deploymentTarget: { iOS: "26.0" }
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
packages:
  MyGuideCore: { path: Packages/MyGuideCore }
targets:
  MyGuide:
    type: application
    platform: iOS
    sources: [MyGuide, Shared]
    dependencies:
      - package: MyGuideCore
      - target: MyGuideWidgets
        embed: true
      - target: MyGuideWatch
        embed: true
    info:
      path: MyGuide/Info.plist
      properties:
        CFBundleDisplayName: MyGuide
        UILaunchScreen: {}
        UIBackgroundModes: [audio, location]
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: io.github.birgerlie.MyGuide
            CFBundleURLSchemes: [myguide]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: "MyGuide uses the camera to photograph what you want a story about."
        NSLocationWhenInUseUsageDescription: "MyGuide uses your exact position and compass heading to work out what you are looking at."
        NSLocationAlwaysAndWhenInUseUsageDescription: "In walking mode MyGuide follows your position with the phone locked, so it can tell you about places you pass."
        NSPhotoLibraryUsageDescription: "MyGuide reads where a picked photo was taken so it can tell its story."
    # Time Sensitive notifications need the paid developer account (the free Personal Team cannot sign
    # that entitlement), so buzzes are delivered at the normal "active" level for now.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.birgerlie.MyGuide
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
  MyGuideWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources: [MyGuideWidgets, Shared]
    info:
      path: MyGuideWidgets/Info.plist
      properties:
        CFBundleDisplayName: MyGuide
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.birgerlie.MyGuide.Widgets
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  MyGuideWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources: [MyGuideWatch]
    info:
      path: MyGuideWatch/Info.plist
      properties:
        CFBundleDisplayName: MyGuide
        WKApplication: true
        WKCompanionAppBundleIdentifier: io.github.birgerlie.MyGuide
        WKBackgroundModes: [workout-processing]
        NSHealthShareUsageDescription: "MyGuide runs a walking workout so the watch can buzz you about places while your wrist is down."
        NSHealthUpdateUsageDescription: "MyGuide runs a walking workout so the watch can buzz you about places while your wrist is down."
    entitlements:
      path: MyGuideWatch/MyGuideWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.birgerlie.MyGuide.watchkitapp
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "4"
